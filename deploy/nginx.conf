server {
    listen 80;
    server_name farabakhshtahvieh.com www.farabakhshtahvieh.com;
    client_max_body_size 25m;

    location /static/ {
        alias /var/www/farabakhsh/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # /media/ عمداً از nginx سرو نمی‌شود؛ جنگو بعد از بررسی دسترسی می‌دهد.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
    }
}
