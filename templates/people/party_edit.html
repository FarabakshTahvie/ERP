{% extends "base.html" %}
{% block title %}ویرایش {{ party.name }} | افراد{% endblock %}
{% block content %}
<div class="fb-page fb-page--sm">
    <div>
        <a href="{% url 'people:party_detail' party.id %}" class="link link-hover text-sm fb-muted">بازگشت به پرونده</a>
        <h1 class="fb-page-title mt-2">ویرایش طرف‌حساب</h1>
        <p class="fb-page-sub">نقش‌ها و کد ملی/ثبت از اینجا عوض نمی‌شوند. شماره‌ی موبایل حساب ورود جداست و با این شماره عوض نمی‌شود.</p>
    </div>
    <form method="post" data-fb-once class="fb-card fb-pad flex flex-col gap-4">
        {% csrf_token %}
        <div class="fb-field"><label class="fb-label" for="p-name">نام</label>
            <input type="text" id="p-name" name="name" value="{{ values.name }}" required class="input w-full"></div>
        <div class="fb-field"><label class="fb-label" for="p-brand">نام برند</label>
            <input type="text" id="p-brand" name="brand_name" value="{{ values.brand_name }}" class="input w-full"></div>
        <div class="grid grid-cols-2 gap-3">
            <div class="fb-field"><label class="fb-label" for="p-phone">شماره تماس</label>
                <input type="text" id="p-phone" name="phone_number" value="{{ values.phone_number }}" dir="ltr" inputmode="numeric" class="input w-full font-technical"></div>
            <div class="fb-field"><label class="fb-label" for="p-phone2">شماره تماس دوم</label>
                <input type="text" id="p-phone2" name="secondary_phone" value="{{ values.secondary_phone }}" dir="ltr" inputmode="numeric" class="input w-full font-technical"></div>
        </div>
        <div class="fb-field"><label class="fb-label" for="p-mail">ایمیل</label>
            <input type="text" id="p-mail" name="email" value="{{ values.email }}" dir="ltr" class="input w-full"></div>
        <div class="fb-field"><label class="fb-label" for="p-credit">سقف اعتبار (تومان)</label>
            <input type="text" id="p-credit" name="credit_limit_raw" value="{{ values.credit_limit_raw }}" dir="ltr" inputmode="numeric" class="input w-full font-technical"></div>
        <div class="fb-field"><label class="fb-label" for="p-desc">توضیحات</label>
            <textarea id="p-desc" name="description" rows="3" class="textarea w-full">{{ values.description }}</textarea></div>
        <div class="flex gap-2">
            <button type="submit" class="btn btn-primary flex-1">ذخیره</button>
            <a href="{% url 'people:party_detail' party.id %}" class="btn btn-ghost flex-1">انصراف</a>
        </div>
    </form>
</div>
{% endblock %}
