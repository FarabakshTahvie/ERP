{% load static custom_tags %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{{ slip.project_code|fa_digits }}</title>
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url("{% static 'fonts/Vazirmatn[wght].woff2' %}") format('woff2');
            font-weight: 100 900;
            font-style: normal;
        }
        @page {
            size: A5;
            margin: 8mm 8mm 12mm 8mm;
            @bottom-center {
                content: "صفحه " counter(page, persian) " از " counter(pages, persian);
                font-family: 'Vazirmatn', sans-serif;
                font-size: 8pt;
                color: #6b7280;
            }
        }
        body { font-family: 'Vazirmatn', sans-serif; direction: rtl; color: #111827; font-size: 10pt; line-height: 1.45; margin: 0; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        thead { display: table-header-group; }
        tr { page-break-inside: avoid; }
        td, th { border: 1px solid #9ca3af; padding: 1.6mm 2.4mm; text-align: right; vertical-align: top; overflow-wrap: anywhere; }
        th { background: #f3f4f6; font-weight: 700; }
        .info b { color: #4b5563; font-weight: 700; }
        .code { width: 26%; }
        .qty { text-align: center; }
        .nm { font-weight: 700; }
    </style>
</head>
<body>
<table>
    <thead>
        <tr>
            <td class="info"><b>طرف‌حساب:</b> {{ slip.party_name }}</td>
            <td class="info code"><b>کد پروژه:</b> <span dir="ltr">{{ slip.project_code|fa_digits }}</span></td>
        </tr>
        <tr>
            <td class="info" colspan="2"><b>آدرس:</b> {{ slip.address|linebreaksbr }}</td>
        </tr>
        <tr><th>نام</th><th class="qty">تعداد</th></tr>
    </thead>
    <tbody>
        {% for r in slip.rows %}
        <tr><td class="nm">{{ r.name }}</td><td class="qty"><span dir="ltr">{{ r.qty|floatformat:"-4"|fa_digits }}</span> {{ r.unit }}</td></tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
