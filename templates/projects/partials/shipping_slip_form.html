{% load custom_tags %}
<div class="flex flex-col gap-2">
    <div class="flex items-start justify-between gap-3 text-sm">
        <span class="min-w-0 break-words"><span class="fb-muted">طرف‌حساب:</span> <span class="font-semibold">{{ slip.party_name }}</span></span>
        <span class="shrink-0"><span class="fb-muted">کد پروژه:</span> <span dir="ltr" class="font-technical">{{ slip.project_code|fa_digits }}</span></span>
    </div>
    <div class="text-sm"><span class="fb-muted">آدرس:</span> <span class="break-words whitespace-pre-line">{{ slip.address }}</span></div>
    <div class="overflow-x-auto">
        <table class="table table-sm text-xs">
            <thead><tr class="fb-muted"><th>نام</th><th class="w-28">تعداد</th></tr></thead>
            <tbody>
            {% for r in slip.rows %}
                <tr>
                    <td class="font-semibold">{{ r.name }}</td>
                    <td><span class="font-technical">{{ r.qty|floatformat:"-4"|fa_digits }}</span> {{ r.unit }}</td>
                </tr>
            {% empty %}
                <tr><td colspan="2" class="fb-empty">اقلامی ثبت نشده است.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
