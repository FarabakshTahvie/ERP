{% load custom_tags %}
<div class="flex flex-col h-full min-h-0">
    <div class="p-3 border-b border-base-300 flex flex-col gap-2">
        <div class="flex items-center justify-between gap-2">
            <div class="font-bold text-base">پیام‌رسان</div>
            <a href="{% url 'messenger:profile' %}" class="btn btn-ghost btn-sm btn-circle" aria-label="پروفایل من">{% icon "user" "w-4 h-4" %}</a>
        </div>
        <label class="input input-sm w-full flex items-center gap-2">
            {% icon "search" "w-4 h-4 opacity-50" %}
            <input type="search" data-msgr-search placeholder="جستجوی گفت‌وگو" aria-label="جستجوی گفت‌وگو" class="grow">
        </label>
    </div>
    <ul data-msgr-list class="flex-1 overflow-y-auto min-h-0"></ul>
</div>
{{ inbox|json_script:"msgr-inbox-initial" }}
