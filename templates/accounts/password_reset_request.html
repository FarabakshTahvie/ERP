{% extends "base.html" %}
{% load custom_tags %}

{% block title %}فراموشی رمز عبور | فرابخش{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md bg-base-200 border border-base-300 shadow-xl">
        <div class="card-body">
            <h1 class="card-title justify-center text-xl font-bold mb-2">فراموشی رمز عبور</h1>
            <p class="text-sm text-base-content/70 text-center mb-4">شماره موبایل حساب کاربری خود را وارد کنید تا کد بازنشانی ارسال شود.</p>

            <form method="post">
                {% csrf_token %}
                <div class="form-control mb-4">
                    <label class="label"><span class="label-text">شماره موبایل</span></label>
                    <input type="tel" name="phone_number" placeholder="09123456789" class="input input-bordered w-full" required dir="ltr">
                </div>

                <button type="submit" class="btn btn-primary w-full gap-2">
                    {% icon "send" "w-5 h-5" %} ارسال کد بازنشانی
                </button>

                <div class="text-center mt-4">
                    <a href="{% url 'accounts:login' %}" class="link link-hover text-sm text-base-content/70">بازگشت به صفحه ورود</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
