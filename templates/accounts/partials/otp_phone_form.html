{% load custom_tags %}
<form id="otp-phone-section" class="space-y-4"
      hx-post="{% url 'accounts:request_otp_login' %}"
      hx-target="#otp-container"
      hx-swap="innerHTML"
      hx-indicator="#otp-spinner"
      hx-disabled-elt="find button">
    {% if error %}
    <div role="alert" class="alert alert-soft alert-error animate-shake">
        {% icon "alert-circle" "w-4 h-4 shrink-0" %}
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <input type="hidden" name="next" value="{{ next }}">

    <div class="fb-field">
        <label class="fb-label" for="otp-phone-input">شماره موبایل ثبت‌شده در سیستم</label>
        <input type="tel" id="otp-phone-input" name="phone_number" value="{{ phone_number|default:'' }}"
               placeholder="09123456789" class="input w-full font-technical"
               required maxlength="11" inputmode="numeric" autocomplete="tel">
    </div>

    <button type="submit" class="btn btn-primary w-full">
        {% icon "send" "w-4 h-4" %}
        <span>ارسال کد به موبایل</span>
        <span id="otp-spinner" class="loading loading-spinner loading-xs htmx-indicator"></span>
    </button>
</form>
