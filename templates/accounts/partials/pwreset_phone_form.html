{% load custom_tags %}
<form id="pwreset-phone-section" class="space-y-4"
      hx-post="{% url 'accounts:password_reset_request' %}"
      hx-target="#pwreset-container" hx-swap="innerHTML"
      hx-indicator="#pwreset-spinner" hx-disabled-elt="find button">
    {% if error %}
    <div role="alert" class="alert alert-soft alert-error animate-shake">
        {% icon "alert-circle" "w-4 h-4 shrink-0" %}
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <div class="fb-field">
        <label class="fb-label" for="pwreset-phone-input">شماره موبایل</label>
        <input type="tel" id="pwreset-phone-input" name="phone_number" value="{{ phone_number|default:'' }}"
               placeholder="09123456789" class="input w-full font-technical"
               required maxlength="11" inputmode="numeric" autocomplete="tel">
    </div>

    <button type="submit" class="btn btn-primary w-full">
        {% icon "send" "w-4 h-4" %}
        <span>ارسال کد بازنشانی</span>
        <span id="pwreset-spinner" class="loading loading-spinner loading-xs htmx-indicator"></span>
    </button>
</form>
