{% load custom_tags %}
{# پارامترها: field_id، name، label | اختیاری: autocomplete (پیش‌فرض current-password)، placeholder، error #}
<div class="fb-field">
    <label class="fb-label" for="{{ field_id }}">{{ label }}</label>
    <div class="relative">
        <input type="password" id="{{ field_id }}" name="{{ name }}" dir="ltr" required
               autocomplete="{{ autocomplete|default:'current-password' }}"
               placeholder="{{ placeholder|default:'••••••••' }}"
               class="input w-full pl-11{% if error %} input-error{% endif %}">
        <button type="button" data-fb-toggle-password aria-label="نمایش یا پنهان‌کردن رمز عبور"
                class="btn btn-ghost btn-xs btn-square absolute left-1.5 top-1/2 -translate-y-1/2 text-base-content/50">
            {% icon "eye" "w-4 h-4" %}
            {% icon "eye-off" "w-4 h-4 hidden" %}
        </button>
    </div>
    {% if error %}<span class="fb-error">{{ error }}</span>{% endif %}
</div>
