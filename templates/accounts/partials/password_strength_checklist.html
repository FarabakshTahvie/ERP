<div class="fb-inset text-xs space-y-1" data-pw-checklist-for="{{ input_id }}">
    <div class="flex items-center gap-1.5" data-check="length">
        <span class="check-icon text-base-content/30">○</span>
        <span>حداقل ۸ کاراکتر</span>
    </div>
    <div class="flex items-center gap-1.5" data-check="digit">
        <span class="check-icon text-base-content/30">○</span>
        <span>حداقل یک عدد</span>
    </div>
    <div class="flex items-center gap-1.5" data-check="letter">
        <span class="check-icon text-base-content/30">○</span>
        <span>حداقل یک حرف</span>
    </div>
</div>
<script>
(function() {
    const input = document.getElementById('{{ input_id }}');
    const checklist = document.querySelector('[data-pw-checklist-for="{{ input_id }}"]');
    if (!input || !checklist) return;

    const rules = {
        length: v => v.length >= 8,
        digit: v => /\d/.test(v),
        letter: v => /[A-Za-z]/.test(v),
    };

    function update() {
        const val = input.value || "";
        Object.keys(rules).forEach(function(key) {
            const row = checklist.querySelector('[data-check="' + key + '"]');
            const icon = row.querySelector('.check-icon');
            if (rules[key](val)) {
                icon.textContent = '✓';
                icon.classList.remove('text-base-content/30');
                icon.classList.add('text-success', 'font-bold');
            } else {
                icon.textContent = '○';
                icon.classList.add('text-base-content/30');
                icon.classList.remove('text-success', 'font-bold');
            }
        });
    }
    input.addEventListener('input', update);
    update();
})();
</script>
